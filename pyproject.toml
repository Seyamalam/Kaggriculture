[project]
name = "kaggriculture-agent"
version = "0.1.0"
description = "A reproducible rule-based agent and local tournament harness for Kaggle's Kaggriculture competition"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kaggle-environments==1.32.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

